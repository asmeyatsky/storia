# cargo-deny — Rust supply-chain and layer-direction policy.
# Rules §1, §2, §4. Schema for cargo-deny >= 0.16.

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"

[licenses]
version = 2
# Workspace crates are proprietary (Cargo.toml `license = "Proprietary"`); skip license
# checks on our own crates and only audit third-party licenses.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Layer enforcement (Rules §2):
# - storia-events is domain-shaped; must NOT pull I/O crates (sqlx, reqwest).
# - reqwest and sqlx are allowed only inside connector / infrastructure crates.
[[bans.deny]]
name = "reqwest"
wrappers = ["storia-connectors-mews", "storia-connectors-cloudbeds"]

[[bans.deny]]
name = "sqlx"
wrappers = ["storia-connectors-mews"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
