[project]
name = "storia-core"
version = "0.1.0"
description = "STORIA domain + application + infrastructure + presentation"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anthropic>=0.40",
    "psycopg[binary]>=3.2",
    "google-cloud-pubsub>=2.23",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "hypothesis>=6",
    "import-linter>=2.1",
    "pip-audit>=2.7",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storia"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = "--cov=storia --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = [
    # Integration-only stubs — exercised by infra/integration suites, not unit tests.
    "src/storia/infrastructure/postgres_event_store.py",
    "src/storia/infrastructure/mews_pms.py",
    # Composition root — covered by a smoke test that imports it.
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
